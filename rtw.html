<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop RTW — Scarlett May</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,0..144,400;1,0..144,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Droid+Sans+Mono&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <header>
    <a href="index 2.html" class="brandmark" aria-label="Scarlett May home"></a>
    <button class="nav-toggle" id="navToggle" aria-label="toggle menu">menu</button>
    <nav class="links" id="navLinks">
      <a href="collections.html">Collections</a>
      <a href="rtw.html">Shop RTW</a>
      <a href="about.html">About</a>
      <a href="index 2.html#contact">Contact</a>
      <a href="https://www.instagram.com/scarlettmay____/" target="_blank" rel="noopener" class="ig-link" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4.2"/>
          <circle cx="17.2" cy="6.8" r=".6" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </nav>
  </header>

  <main>
    <section class="notice">
      <div class="wrap">
        <h1>Shop RTW</h1>
        <p>RTW pieces released soon. Details, sizes, and ordering information will appear here when pieces are ready.</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-bottom">
      <span>© 2026 by Scarlett Mandić, founder of Scarlett May.</span>
      <div class="footer-socials">
        <a href="https://www.instagram.com/scarlettmay____/" target="_blank" rel="noopener">Instagram</a>
        <a href="index 2.html#contact">Email</a>
      </div>
    </div>
  </footer>

  <script>
    const toggle = document.getElementById('navToggle');
    const links = document.getElementById('navLinks');
    toggle.addEventListener('click', () => {
      const open = links.classList.toggle('open');
      toggle.textContent = open ? 'close' : 'menu';
    });
    links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      links.classList.remove('open');
      toggle.textContent = 'menu';
    }));
  </script>
</body>
</html>
